unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set-option -s escape-time 100

# Fix tmux terminal tabs
set-option -g set-titles on
set-option -g set-titles-string "#S / #W"

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind C-l send-keys 'C-l'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

new
attach
split-pane -v
select-pane -t 1
split-pane -h
send-keys -t %0 "nvtop" C-m
send-keys -t %2 "htop" C-m
send-keys -t %1 C-l
send-keys -t %1 "fastfetch" C-m
resize-pane -t %0 -y 13
select-pane -t %1
# Automatically rename tmux session based on hostname and trailing IP
run-shell 'tmux rename-session "$(hostname)_$(hostname -I | awk "{print \$1}" | awk -F "." "{print \$NF}")"'

run '~/.tmux/plugins/tpm/tpm'

